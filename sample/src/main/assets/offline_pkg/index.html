<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bitwebc Demo - 离线包 + WebMessage</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        button { padding: 10px 14px; margin-right: 10px; margin-bottom: 10px; }
        .tip { color: #555; margin-top: 16px; }
        .section { margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee; }
        #webmessage-log { background: #f5f5f5; padding: 10px; min-height: 40px; font-size: 12px; }
    </style>
    <script>
        function callNative() {
            if (window.BitwebcApp && window.BitwebcApp.showToast) {
                window.BitwebcApp.showToast("你好，Bitwebc");
            } else {
                alert("Bridge 未注入");
            }
        }

        function onNativeReady(message) {
            const el = document.getElementById("native-msg");
            el.textContent = message;
        }

        // ---------- WebMessage 演示：接收 Native 传来的 port，双向收发 ----------
        var messagePortFromNative = null;

        window.addEventListener('message', function(event) {
            if (event.ports && event.ports.length > 0) {
                messagePortFromNative = event.ports[0];
                logWebMessage('已收到 Native 传来的 MessagePort');
                messagePortFromNative.onmessage = function(e) {
                    logWebMessage('收到 Native 消息: ' + (e.data || '[无数据]'));
                };
                // 可选：主动发一条给 Native
                messagePortFromNative.postMessage('ping from JS');
            }
        });

        function sendViaWebMessage() {
            if (!messagePortFromNative) {
                logWebMessage('尚未收到 Native 的 port');
                return;
            }
            var msg = 'JS->Native @ ' + new Date().toLocaleTimeString();
            messagePortFromNative.postMessage(msg);
            logWebMessage('已发送: ' + msg);
        }

        function logWebMessage(text) {
            var el = document.getElementById("webmessage-log");
            el.textContent = (el.textContent ? el.textContent + '\n' : '') + text;
        }
    </script>
</head>
<body>
<h2>Bitwebc 示例（离线包拦截 + WebMessage）</h2>
<p class="tip">本页通过 <strong>静态资源拦截</strong> 从 assets/offline_pkg/ 加载，未走网络。</p>

<button onclick="callNative()">JS 调用 Native Toast</button>
<input type="file" multiple />
<p class="tip">Native 注入消息：<span id="native-msg">等待中...</span></p>

<div class="section">
    <h3>WebMessage 双向通道</h3>
    <button onclick="sendViaWebMessage()">通过 WebMessage 发往 Native</button>
    <pre id="webmessage-log">等待 Native 建立 MessagePort...</pre>
</div>
</body>
</html>
