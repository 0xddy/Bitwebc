<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bitwebc 离线资源示例</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        button { padding: 10px 14px; margin: 0 10px 10px 0; }
        .tip { color: #555; margin-top: 16px; }
        .section { margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee; }
        #webmessage-log { background: #f5f5f5; padding: 10px; min-height: 40px; font-size: 12px; }
    </style>
    <script>
        function callNative() {
            if (window.BitwebcApp && window.BitwebcApp.showToast) {
                window.BitwebcApp.showToast("你好，Bitwebc").catch(console.error);
            } else {
                alert("Bridge 尚未注入");
            }
        }

        function onNativeReady(message) {
            document.getElementById("native-msg").textContent = message;
        }

        let messagePortFromNative = null;
        window.addEventListener("message", function(event) {
            if (!event.ports || event.ports.length === 0) return;
            messagePortFromNative = event.ports[0];
            logWebMessage("已收到 Native 传来的 MessagePort");
            messagePortFromNative.onmessage = function(messageEvent) {
                logWebMessage("收到 Native 消息：" + (messageEvent.data || "[无数据]"));
            };
            messagePortFromNative.postMessage("ping from JS");
        });

        function sendViaWebMessage() {
            if (!messagePortFromNative) {
                logWebMessage("尚未收到 Native MessagePort");
                return;
            }
            const message = "JS → Native @ " + new Date().toLocaleTimeString();
            messagePortFromNative.postMessage(message);
            logWebMessage("已发送：" + message);
        }

        function logWebMessage(text) {
            const element = document.getElementById("webmessage-log");
            element.textContent = (element.textContent ? element.textContent + "\n" : "") + text;
        }

        function triggerDownload() {
            const link = document.createElement("a");
            link.href = "data:text/plain;charset=utf-8," + encodeURIComponent("Bitwebc download demo");
            link.download = "bitwebc-demo.txt";
            document.body.appendChild(link);
            link.click();
            link.remove();
        }
    </script>
</head>
<body>
<h2>Bitwebc 离线资源示例</h2>
<p class="tip">本页面由 resources → assets 从应用资源加载，没有访问网络。</p>

<button onclick="callNative()">JS 调用 Native Toast</button>
<button onclick="triggerDownload()">触发下载</button>
<input type="file" multiple />
<p class="tip">Native 状态：<span id="native-msg">等待中……</span></p>

<div class="section">
    <h3>WebMessage 双向通道</h3>
    <button onclick="sendViaWebMessage()">向 Native 发送消息</button>
    <pre id="webmessage-log">等待 Native 建立 MessagePort……</pre>
</div>
</body>
</html>
