# 推送 v* 标签时自动构建库 AAR + sample 调试包，并创建 GitHub Release；也可在 Actions 页手动运行。
# 手动运行时可在「版本号」中填写（如 0.2.0）；留空则与打标签一致，使用 gradle.properties 的 VERSION_NAME。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.2.0）；留空则使用 gradle.properties 的 VERSION_NAME'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read VERSION_NAME and set release tag
        id: version
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          MANUAL_TRIMMED=$(echo "$MANUAL_VERSION" | tr -d '[:space:]')
          if [[ -n "$MANUAL_TRIMMED" ]]; then
            VERSION_NAME="$MANUAL_TRIMMED"
          else
            VERSION_NAME=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          fi
          if [[ -z "$VERSION_NAME" ]]; then echo "::error::VERSION_NAME 未设置（请填写版本号或保证 gradle.properties 中有 VERSION_NAME）"; exit 1; fi
          if [[ "$VERSION_NAME" != v* ]]; then RELEASE_TAG="v$VERSION_NAME"; else RELEASE_TAG="$VERSION_NAME"; fi
          # APK 文件名用无 v 前缀的版本号
          VERSION_FOR_FILE="$VERSION_NAME"
          [[ "$VERSION_FOR_FILE" == v* ]] && VERSION_FOR_FILE="${VERSION_FOR_FILE#v}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_FOR_FILE" >> "$GITHUB_OUTPUT"
          echo "Release tag: $RELEASE_TAG (version label: $VERSION_FOR_FILE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build library AARs and sample APK
        run: |
          ./gradlew :bitwebc-core:assembleRelease \
            :bitwebc-filechooser:assembleRelease \
            :bitwebc-download:assembleRelease \
            :sample:assembleDebug \
            --no-daemon

      - name: Collect release assets
        run: |
          mkdir -p release-aars
          cp bitwebc-core/build/outputs/aar/bitwebc-core-release.aar release-aars/
          cp bitwebc-filechooser/build/outputs/aar/bitwebc-filechooser-release.aar release-aars/
          cp bitwebc-download/build/outputs/aar/bitwebc-download-release.aar release-aars/
          cp sample/build/outputs/apk/debug/sample-debug.apk \
            "release-aars/bitwebc-sample-${{ steps.version.outputs.version }}-debug.apk"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release-aars/bitwebc-core-release.aar
            release-aars/bitwebc-filechooser-release.aar
            release-aars/bitwebc-download-release.aar
            release-aars/bitwebc-sample-${{ steps.version.outputs.version }}-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
