name: Build, Test, and Release

on:
  push:
    tags:
      - "v*"
    branches:
      - master
      - main
    paths:
      - ".github/workflows/release.yml"
      - "sample/**"
      - "bitwebc-core/**"
      - "bitwebc-filechooser/**"
      - "bitwebc-download/**"
      - "bitwebc-compose/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "jitpack.yml"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.2.0); blank uses VERSION_NAME"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.version || 'VERSION_NAME') || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "emulator"

      - name: Verify tests, lint, and debug builds
        run: |
          chmod +x gradlew
          ./gradlew \
            test lintDebug assembleDebug :sample:assembleRelease \
            :bitwebc-core:publishReleasePublicationToMavenLocal \
            :bitwebc-filechooser:publishReleasePublicationToMavenLocal \
            :bitwebc-download:publishReleasePublicationToMavenLocal \
            :bitwebc-compose:publishReleasePublicationToMavenLocal \
            --no-daemon --stacktrace

      - name: Enable KVM for the managed test device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android managed-device smoke test
        run: |
          ./gradlew \
            :bitwebc-compose:pixel2Api35DebugAndroidTest \
            :bitwebc-filechooser:pixel2Api35DebugAndroidTest \
            :sample:pixel2Api35DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            --no-daemon --stacktrace

      - name: Prepare versioned sample APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        id: sample-version
        shell: bash
        run: |
          version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2-)"
          version="${version#v}"
          if [[ -z "$version" ]]; then
            echo "::error::VERSION_NAME is missing from gradle.properties"
            exit 1
          fi
          mkdir -p sample-out
          cp sample/build/outputs/apk/debug/sample-debug.apk \
            "sample-out/bitwebc-sample-$version-debug.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload versioned sample APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: bitwebc-sample-${{ steps.sample-version.outputs.version }}-debug
          path: sample-out/bitwebc-sample-${{ steps.sample-version.outputs.version }}-debug.apk
          retention-days: 3
          compression-level: 9

  release:
    needs: quality
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version || '' }}
        shell: bash
        run: |
          manual_version="$(echo "$MANUAL_VERSION" | tr -d '[:space:]')"
          if [[ -n "$manual_version" ]]; then
            version="$manual_version"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2-)"
          fi
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Invalid or missing release version: $version"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify an existing release tag matches this commit
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $RELEASE_TAG points to $tag_commit, not current commit $GITHUB_SHA"
              exit 1
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build release assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew \
            :bitwebc-core:assembleRelease \
            :bitwebc-filechooser:assembleRelease \
            :bitwebc-download:assembleRelease \
            :bitwebc-compose:assembleRelease \
            :sample:assembleDebug \
            :sample:assembleRelease \
            -PVERSION_NAME="$RELEASE_VERSION" \
            --no-daemon --stacktrace

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp bitwebc-core/build/outputs/aar/bitwebc-core-release.aar release-assets/
          cp bitwebc-filechooser/build/outputs/aar/bitwebc-filechooser-release.aar release-assets/
          cp bitwebc-download/build/outputs/aar/bitwebc-download-release.aar release-assets/
          cp bitwebc-compose/build/outputs/aar/bitwebc-compose-release.aar release-assets/
          cp sample/build/outputs/apk/debug/sample-debug.apk \
            "release-assets/bitwebc-sample-${{ steps.version.outputs.version }}-debug.apk"

      - name: Atomically create or re-verify the release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          else
            git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
            if ! git push origin "refs/tags/$RELEASE_TAG"; then
              git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            fi
          fi
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $RELEASE_TAG points to $tag_commit, not current commit $GITHUB_SHA"
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/bitwebc-core-release.aar
            release-assets/bitwebc-filechooser-release.aar
            release-assets/bitwebc-download-release.aar
            release-assets/bitwebc-compose-release.aar
            release-assets/bitwebc-sample-${{ steps.version.outputs.version }}-debug.apk
