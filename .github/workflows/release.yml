# 推送 v* 标签时自动构建库模块并创建 GitHub Release，并上传 AAR 产物
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build library AARs
        run: |
          ./gradlew :bitwebc-core:assembleRelease \
            :bitwebc-filechooser:assembleRelease \
            :bitwebc-download:assembleRelease \
            --no-daemon

      - name: Collect AAR artifacts
        run: |
          mkdir -p release-aars
          cp bitwebc-core/build/outputs/aar/bitwebc-core-release.aar release-aars/
          cp bitwebc-filechooser/build/outputs/aar/bitwebc-filechooser-release.aar release-aars/
          cp bitwebc-download/build/outputs/aar/bitwebc-download-release.aar release-aars/

      - name: Create GitHub Release and upload AARs
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-aars/bitwebc-core-release.aar
            release-aars/bitwebc-filechooser-release.aar
            release-aars/bitwebc-download-release.aar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
