# 编译打包 sample 示例 APK。
# 配额说明：Artifacts / Actions 缓存均计入 GitHub 用量（私有库约 500MB Artifacts + 缓存额度）。
# 本工作流：缩短 Artifact 保留、PR 仅编译不上传 APK，以降低占用。定期在 Settings → Actions → General 清理缓存与旧运行。
name: Build Sample APK

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/sample.yml'
      - 'sample/**'
      - 'bitwebc-core/**'
      - 'bitwebc-filechooser/**'
      - 'bitwebc-download/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 若缓存占用过高：去掉下一项的 cache: gradle（构建变慢但不占缓存配额）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build sample (debug APK)
        run: ./gradlew :sample:assembleDebug --no-daemon --stacktrace

      # 仅 push / 手动运行上传 APK，避免每个 PR 都占 Artifact 空间；保留 3 天（最短可改为 1）
      - name: Upload debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sample-debug-apk
          path: sample/build/outputs/apk/debug/*.apk
          retention-days: 3
          compression-level: 9
